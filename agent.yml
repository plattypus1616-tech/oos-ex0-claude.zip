name: oos-agent
on:
  schedule:
    - cron: "15 14 * * 1-5"   # 14:15 UTC = 21:15 WIB = pagi hari kerja di AS (Timur)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oos-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - run: pip install -r requirements-agent.txt
      - run: python -m agent.run
        env:
          MODE: ${{ vars.MODE || 'dry' }}
          DAILY_CAP: ${{ vars.DAILY_CAP || '5' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Simpan state
        run: |
          git config user.name "oos-agent"
          git config user.email "oos-agent@users.noreply.github.com"
          git add state targets.txt
          git diff --cached --quiet || (git commit -m "state $(date -u +%F)" && git push)
